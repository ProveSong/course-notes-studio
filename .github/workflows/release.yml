name: Windows desktop build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build desktop archive
        shell: pwsh
        run: ./build.ps1
      - name: Tests
        shell: pwsh
        env:
          COURSE_NOTES_HOME: ${{ runner.temp }}/course-notes-tests
        run: ./.venv-build/Scripts/python.exe -m unittest discover -s tests
      - name: Packaged GUI smoke check
        shell: pwsh
        run: |
          $report=Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $process=Start-Process -FilePath './dist/CourseNotesStudio/CourseNotesStudio.exe' -ArgumentList @('--smoke-test','--report',"`"$report`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {throw 'Packaged GUI check failed'}
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: CourseNotesStudio-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' dist/*.zip dist/*.sha256 --clobber
          } else {
            gh release create '${{ github.ref_name }}' dist/*.zip dist/*.sha256 --title 'Course Notes Studio ${{ github.ref_name }}' --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {throw 'Release upload failed'}
