[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-notes-studio"
version = "0.2.4"
description = "Local GPU course transcription and OCR with readable Markdown teaching notes"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["opencv-python>=4.10,<5", "Pillow>=10,<13", "requests>=2.31,<3"]

[project.scripts]
course-notes = "course_notes.cli:main"

[tool.setuptools.packages.find]
include = ["course_notes*"]

[tool.setuptools.data-files]
"skills/course-handout" = ["skills/course-handout/SKILL.md", "skills/course-handout/compact.md"]
"skills/board-structure" = ["skills/board-structure/SKILL.md"]
"skills/course-explainer" = ["skills/course-explainer/SKILL.md"]
